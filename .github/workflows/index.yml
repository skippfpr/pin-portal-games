# On a pull request: check every game with the same safety check the portal uses.
# After a merge to main: rebuild index.json (the list the portal reads) and commit it.
name: index
on:
  pull_request:
    paths: ['games/**', 'reviewed.json', 'tools/**']
  push:
    branches: [main]
    paths: ['games/**', 'reviewed.json', 'tools/**']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Game Template (so its own files are not listed as new code)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: skippfpr/pin-portal
          path: pin-portal
      - name: Check the games
        if: github.event_name == 'pull_request'
        run: python3 tools/build_index.py --check --template pin-portal/game-template
      - name: Rebuild index.json
        if: github.event_name == 'push'
        run: |
          python3 tools/build_index.py --template pin-portal/game-template
          git config user.name "index bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || { git commit -m "Rebuild index.json"; git push; }
